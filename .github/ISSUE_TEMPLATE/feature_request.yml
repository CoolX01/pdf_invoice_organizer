name: 功能建议
description: 提议新的识别、导出、归档、界面或发布功能
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述当前流程中的痛点或重复操作。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你希望应用如何表现。
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 风险与安全边界
      description: 如果涉及删除、移动、覆盖、重命名发票文件，请说明希望如何确认和回滚。
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如果有替代做法，可以写在这里。
